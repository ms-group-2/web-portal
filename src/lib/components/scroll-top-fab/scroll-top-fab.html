@if (isVisible()) {
  <button
    type="button"
    (click)="scrollToTop()"
    class="fixed bottom-[6.5rem] right-9 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-white text-swap border-2 border-gray-200 shadow-xl transition-all hover:scale-110 hover:shadow-2xl hover:border-swap">
    <mat-icon class="!text-2xl">keyboard_arrow_up</mat-icon>
  </button>
}
